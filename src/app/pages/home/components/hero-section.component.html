<section class="hero">
  <div class="container hero__content">
<h1 class="hero__headline">Fill Your Lineup. <span class="hero__headline-accent">Every Time.</span></h1>
    <p class="hero__subhead">Two players just bailed. Your game is in 3 hours. FirstString handles the callup chain automatically, so you're not burning your Sunday texting down a list.</p>

    <div class="hero__actions">
      <button
        class="pill-btn hero__btn hero__btn--primary"
        (click)="scrollToSignup()"
        >Get Early Access →</button
      >
      <a routerLink="/features" class="pill-btn hero__btn hero__btn--outline"
        >See How It Works</a
      >
    </div>
  </div>
  <div class="hero__wave">
    <svg viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,40 C360,80 1080,0 1440,40 L1440,80 L0,80 Z" fill="var(--surface)" />
    </svg>
  </div>
</section>
