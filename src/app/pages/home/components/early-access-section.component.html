<section class="early-access" id="early-access">
  <div class="container early-access__content">
    <p class="section-label section-label--light">Early Access</p>
    <h2 class="early-access__heading">Your Roster Is Waiting on You</h2>
    <p class="early-access__sub">
      FirstString is in beta. Join the list and we'll reach out when it's ready for your team.
    </p>

    <iframe
      width="540"
      height="305"
      src="https://62ec1b70.sibforms.com/v2/serve/MUIFACD297OSt9Fao3nBW48I81RDWIw4gZYc9wuIj3HA8SGMbTJZ92w1R6LYxWAIi-0Gg6XPtPNDNwjIRcFgu6Qxr50tPtw6-W5gjHnG49dUPJAUDBvkVpHfxCGWENi1i5H9uWlorNVL8GxAtYw_Ve1JO8nFRRBtuIOxMvJhaKwX5fkOKrH8aMaIJBK6Io5OAJKwSOCx2YAGqqgVjw=="
      frameborder="0"
      scrolling="auto"
      allowfullscreen
      style="display: block; margin-left: auto; margin-right: auto; max-width: 100%"
    ></iframe>

    <div class="early-access__share-block">
      <p class="early-access__share-prompt">Just signed up? Tell a fellow captain.</p>
      <div class="early-access__share-btns">
        <button class="early-access__share-btn early-access__share-btn--fb" (click)="shareOnFacebook()">
          <svg class="early-access__share-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
          Share on Facebook
        </button>
        <button class="early-access__share-btn early-access__share-btn--copy" (click)="copyShareMessage()">
          <svg class="early-access__share-icon early-access__share-icon--stroke" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            @if (copied()) {
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
            } @else {
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            }
          </svg>
          {{ copied() ? 'Copied!' : 'Copy Message' }}
        </button>
      </div>
    </div>
  </div>
</section>
